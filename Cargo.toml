[package]
name = "leetui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight local-first LeetCode CLI and TUI"
license = "MIT"

[dependencies]
anyhow = "1.0"
atomicwrites = "0.4.4"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
htmd = "0.5"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
pulldown-cmark = "0.13"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "=10.0.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "process"] }
toml = "1.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
